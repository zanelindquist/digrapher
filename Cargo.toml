[package]
name = "digrapher"
version = "2.3.1"
edition = "2021"

[dependencies]
gloo-console = "0.4.0"
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
gloo-timers = "0.4.0"
gloo-utils = "0.3.0"
js-sys = "0.3.95"
serde = "1.0.228"
serde_json = "1.0.149"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
web-sys = { version = "0.3.95", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "CssStyleDeclaration",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect"
] }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
